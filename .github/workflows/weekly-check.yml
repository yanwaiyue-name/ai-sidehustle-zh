name: weekly-check

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 数据校验 + 来源链接探测
        shell: pwsh
        run: ./scripts/check_links.ps1 -ProbeLinks

      - name: 重新渲染网页与详情页
        shell: pwsh
        run: ./scripts/render.ps1

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ docs/ README.md
          if git diff --cached --quiet; then echo "无变化，跳过提交"; exit 0; fi
          git commit -m "chore: 每周体检结果更新"
          git pull --rebase --autostash
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
